name: Validar HTML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    name: Crear máquina virtual y validar
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar código HTML
        run: |
          echo "Inicio de la validación"
          npx html-validator '**/*.html'
          echo "fin"